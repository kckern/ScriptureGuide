name: release
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      extension:
        description: Upload the current extension version to the Chrome Web Store again
        type: boolean
        default: false
      npm:
        description: Publish the current scripture-guide version to npm (needs NPM_PUBLISH=true)
        type: boolean
        default: false
concurrency: release-${{ github.ref }}
permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  # Every job that publishes waits for the full test suite; a red test stops the release.
  test:
    uses: ./.github/workflows/test.yml

  # Applies pending changesets (.changeset/*.md) and commits the version bump to master. The
  # jobs below build and publish that commit. A push without changesets passes through
  # unchanged: the website still deploys, and nothing is published to npm or the store.
  # The bump is pushed with GITHUB_TOKEN, so it does not start another run of this workflow.
  # Only the commit the tests ran on is released: if master moved during the run, this run sets
  # skip and publishes nothing, and the run for the newer commit releases everything instead.
  # Runs on master only, so a dispatch from another branch can neither publish nor push.
  version:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.v.outputs.skip }}
      sha: ${{ steps.v.outputs.sha }}
      package: ${{ steps.v.outputs.package }}
      web: ${{ steps.v.outputs.web }}
      extension: ${{ steps.v.outputs.extension }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - id: v
        run: |
          ver() { node -p "require('./$1/package.json').version"; }
          newer() { echo "::notice::master moved past $GITHUB_SHA during this run; the run for the newer commit releases it"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          git fetch -q --depth=1 origin master
          [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ] || newer
          before_pkg=$(ver packages/scripture-guide); before_web=$(ver apps/web); before_ext=$(ver apps/chrome-extension)
          if find .changeset -name '*.md' ! -name README.md | grep -q .; then
            npm ci --ignore-scripts
            npm run version-packages
            pkg=$(ver packages/scripture-guide); web=$(ver apps/web); ext=$(ver apps/chrome-extension)
            msg="chore: release"
            [ "$pkg" != "$before_pkg" ] && msg="$msg scripture-guide@$pkg"
            [ "$web" != "$before_web" ] && msg="$msg web@$web"
            [ "$ext" != "$before_ext" ] && msg="$msg extension@$ext"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m "$msg"
            # Rejected if master moved since the fetch above
            git push origin HEAD:master || newer
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          [ "$(ver packages/scripture-guide)" != "$before_pkg" ] && echo "package=true" >> "$GITHUB_OUTPUT"
          [ "$(ver apps/web)" != "$before_web" ] && echo "web=true" >> "$GITHUB_OUTPUT"
          [ "$(ver apps/chrome-extension)" != "$before_ext" ] && echo "extension=true" >> "$GITHUB_OUTPUT"
          true

  # Publishes scripture-guide with npm trusted publishing (GitHub OIDC, no token). Needs the
  # repo variable NPM_PUBLISH=true and a Trusted Publisher entry on npmjs.com for release.yml.
  # Dispatch with npm: true to publish a version that is already bumped.
  npm:
    needs: version
    if: needs.version.outputs.skip != 'true' && vars.NPM_PUBLISH == 'true' && (needs.version.outputs.package == 'true' || inputs.npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ needs.version.outputs.sha }}' }
      # Node 24 ships npm 11, which supports npm trusted publishing.
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm', registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npm run build -w scripture-guide
      - run: npm publish -w scripture-guide --provenance --access public

  # Each architecture builds on its own runner and is pushed by digest. Emulating arm64 under
  # QEMU crashed `npm ci` and hung the job until the 6-hour limit.
  web-image-build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ needs.version.outputs.sha }}' }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: built
        name: Record the build time
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            SG_COMMIT=${{ needs.version.outputs.sha }}
            SG_BUILD_NUMBER=${{ github.run_number }}
            SG_RUN_ID=${{ github.run_id }}
            SG_BUILT_AT=${{ steps.built.outputs.at }}
          labels: org.opencontainers.image.source=https://github.com/kckern/ScriptureGuide
          outputs: type=image,name=ghcr.io/kckern/scripture-guide,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,scope=web-${{ matrix.arch }},mode=max
      - name: Record the digest
        env: { DIGEST: '${{ steps.build.outputs.digest }}' }
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: web-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Every push tags :edge, :sha-<short> and :sha-<full>; a release that bumps apps/web's version
  # also tags :<version> and :latest.
  web-image:
    needs: [version, web-image-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/kckern/scripture-guide
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ needs.version.outputs.sha }}' }
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: web-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Publish the multi-architecture tags
        id: publish
        working-directory: ${{ runner.temp }}/digests
        env: { WEB_RELEASE: '${{ needs.version.outputs.web }}' }
        run: |
          sha_tag="$IMAGE:sha-$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          tags=(-t "$IMAGE:edge" -t "$sha_tag" -t "$IMAGE:sha-$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)")
          if [ "$WEB_RELEASE" = true ]; then
            version=$(node -p "require('$GITHUB_WORKSPACE/apps/web/package.json').version")
            tags+=(-t "$IMAGE:$version" -t "$IMAGE:latest")
          fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          echo "digest=$(docker buildx imagetools inspect "$sha_tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - env: { DIGEST: '${{ steps.publish.outputs.digest }}' }
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # Uploads to the Chrome Web Store only when the version job bumped the extension, or when
  # dispatched with extension: true.
  # Signs in to Google with GitHub's OIDC token (workload identity federation, no stored key)
  # as cws-publisher@book-of-mormon-online, which the Developer Dashboard lists as this
  # publisher's service account. Needs the repo variable CWS_PUBLISHER_ID.
  extension:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXTENSION_ID: lkagejkikblabiegfnehlknmlgckhgan
      PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ needs.version.outputs.sha }}' }
      - if: (needs.version.outputs.extension == 'true' || inputs.extension)
        uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - if: (needs.version.outputs.extension == 'true' || inputs.extension)
        run: |
          npm ci
          npm run build -w scripture-guide
          npm run build -w scripture-guide-chrome-extension
          cd apps/chrome-extension/dist && zip -r -q ../extension.zip .
      - if: (needs.version.outputs.extension == 'true' || inputs.extension)
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-zip
          path: apps/chrome-extension/extension.zip
      - if: (needs.version.outputs.extension == 'true' || inputs.extension) && env.PUBLISHER_ID != ''
        id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1065695413052/locations/global/workloadIdentityPools/github/providers/scriptureguide
          service_account: cws-publisher@book-of-mormon-online.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - if: (needs.version.outputs.extension == 'true' || inputs.extension) && env.PUBLISHER_ID != ''
        name: Upload and publish to the Chrome Web Store
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          scripts/release/cws.sh cancel-pending
          scripts/release/cws.sh upload apps/chrome-extension/extension.zip
          scripts/release/cws.sh publish
      - if: (needs.version.outputs.extension == 'true' || inputs.extension) && env.PUBLISHER_ID == ''
        run: echo "::warning::CWS_PUBLISHER_ID is not set; built the extension but did not upload it"

  # Rebuilds the public seed image when data/seeds changes.
  # Waits for the tests (which include the seed checks) and runs on master only.
  seed-image:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: c
        env: { BEFORE: '${{ github.event.before }}' }
        run: |
          # Compare the whole push, not just its last commit. A new branch has an all-zero "before".
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BEFORE" HEAD | grep -qE '^(data/seeds/|infra/seed/)'; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.c.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.c.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.c.outputs.changed == 'true'
        uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - if: steps.c.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/seed/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kckern/scripture-guide-seed:latest,ghcr.io/kckern/scripture-guide-seed:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/kckern/ScriptureGuide
