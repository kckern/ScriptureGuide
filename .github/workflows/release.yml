name: release
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency: release-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  # Opens/updates the "Version packages" PR while changesets are pending;
  # once that PR is merged, publishes any package version not yet on npm.
  changesets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 24 ships npm 11, which supports npm trusted publishing (GitHub OIDC, no token).
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm', registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npm run build -w scripture-guide
      # npm publishing stays off until npmjs.com trusts this workflow for scripture-guide
      # (package Settings > Trusted Publisher > GitHub Actions, workflow release.yml) and
      # the repo variable NPM_PUBLISH is 'true'. Until then this job only opens version PRs.
      - if: vars.NPM_PUBLISH != 'true'
        run: echo "::notice::NPM_PUBLISH is not 'true'; skipped publishing scripture-guide to npm"
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: ${{ vars.NPM_PUBLISH == 'true' && 'npm run release' || '' }}
          title: 'Version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  # Each architecture builds on its own runner and is pushed by digest. Emulating arm64 under
  # QEMU crashed `npm ci` and hung the job until the 6-hour limit.
  web-image-build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.source=https://github.com/kckern/ScriptureGuide
          outputs: type=image,name=ghcr.io/kckern/scripture-guide,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,scope=web-${{ matrix.arch }},mode=max
      - name: Record the digest
        env: { DIGEST: '${{ steps.build.outputs.digest }}' }
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: web-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Every push tags :edge and :sha-<short>; a commit that bumps apps/web's version (the merged
  # Version PR) also tags :<version> and :latest.
  web-image:
    needs: web-image-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/kckern/scripture-guide
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: web-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Publish the multi-architecture tags
        id: publish
        working-directory: ${{ runner.temp }}/digests
        run: |
          sha_tag="$IMAGE:sha-$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          tags=(-t "$IMAGE:edge" -t "$sha_tag")
          if git -C "$GITHUB_WORKSPACE" diff HEAD^1 HEAD -- apps/web/package.json | grep -q '^[-+]  "version"'; then
            version=$(node -p "require('$GITHUB_WORKSPACE/apps/web/package.json').version")
            tags+=(-t "$IMAGE:$version" -t "$IMAGE:latest")
          fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          echo "digest=$(docker buildx imagetools inspect "$sha_tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - env: { DIGEST: '${{ steps.publish.outputs.digest }}' }
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # Uploads to the Chrome Web Store only on the commit that bumps the extension's version.
  # Signs in to Google with GitHub's OIDC token (workload identity federation, no stored key)
  # as cws-publisher@book-of-mormon-online, which the Developer Dashboard lists as this
  # publisher's service account. Needs the repo variable CWS_PUBLISHER_ID.
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXTENSION_ID: lkagejkikblabiegfnehlknmlgckhgan
      PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - id: v
        run: |
          if git diff HEAD^1 HEAD -- apps/chrome-extension/package.json | grep -q '^[-+]  "version"'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.release == 'true'
        uses: actions/setup-node@v7
        with: { node-version: '20', cache: 'npm' }
      - if: steps.v.outputs.release == 'true'
        run: |
          npm ci
          npm run build -w scripture-guide
          npm test -w scripture-guide-chrome-extension -- --ci
          npm run build -w scripture-guide-chrome-extension
          cd apps/chrome-extension/dist && zip -r -q ../extension.zip .
      - if: steps.v.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-zip
          path: apps/chrome-extension/extension.zip
      - if: steps.v.outputs.release == 'true' && env.PUBLISHER_ID != ''
        id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1065695413052/locations/global/workloadIdentityPools/github/providers/scriptureguide
          service_account: cws-publisher@book-of-mormon-online.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - if: steps.v.outputs.release == 'true' && env.PUBLISHER_ID != ''
        name: Upload and publish to the Chrome Web Store
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          item="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"
          api=https://chromewebstore.googleapis.com
          auth=(-H "Authorization: Bearer $TOKEN")
          upload=$(curl -sS --fail-with-body "${auth[@]}" -H 'Content-Type: application/zip' \
            --data-binary @apps/chrome-extension/extension.zip "$api/upload/v2/$item:upload")
          echo "upload: $upload"
          state=$(jq -r .uploadState <<<"$upload")
          for _ in $(seq 1 30); do
            [ "$state" = IN_PROGRESS ] || break
            sleep 10
            state=$(curl -sS --fail-with-body "${auth[@]}" "$api/v2/$item:fetchStatus" | jq -r .lastAsyncUploadState)
            echo "upload state: $state"
          done
          [ "$state" = SUCCEEDED ] || { echo "::error::upload ended in state $state"; exit 1; }
          # No --fail here: a rejected submission's reason is in the body, so print it first
          publish=$(curl -sS "${auth[@]}" -H 'Content-Type: application/json' \
            -d '{"publishType":"DEFAULT_PUBLISH"}' "$api/v2/$item:publish")
          echo "publish: $publish"
          case "$(jq -r .state <<<"$publish")" in
            PENDING_REVIEW|PUBLISHED|STAGED|PUBLISHED_TO_TESTERS) ;;
            *) echo "::error::publish was not accepted"; exit 1 ;;
          esac
      - if: steps.v.outputs.release == 'true' && env.PUBLISHER_ID == ''
        run: echo "::warning::CWS_PUBLISHER_ID is not set; built the extension but did not upload it"

  # Rebuilds the public seed image when data/seeds changes.
  seed-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: c
        env: { BEFORE: '${{ github.event.before }}' }
        run: |
          # Compare the whole push, not just its last commit. A new branch has an all-zero "before".
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BEFORE" HEAD | grep -qE '^(data/seeds/|infra/seed/)'; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.c.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.c.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.c.outputs.changed == 'true'
        uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - if: steps.c.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/seed/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kckern/scripture-guide-seed:latest,ghcr.io/kckern/scripture-guide-seed:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/kckern/ScriptureGuide
