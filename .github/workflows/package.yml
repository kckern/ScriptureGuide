name: scripture-guide package

on:
  pull_request:
    branches: [master, main]
    paths: ['packages/scripture-guide/**', 'package-lock.json', '.github/workflows/package.yml']
  push:
    branches: [master, main]
    paths: ['packages/scripture-guide/**', 'package-lock.json', '.github/workflows/package.yml']

jobs:
  critical:
    name: Critical Tests (Merge Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build -w scripture-guide

      - name: Run Critical Tests
        run: npm run test:critical -w scripture-guide -- --ci

  edge-cases:
    name: Edge Case Tests (Release Gate)
    runs-on: ubuntu-latest
    needs: critical
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build -w scripture-guide

      - name: Run Edge Case Tests
        run: npm run test:edge -w scripture-guide -- --ci

  known-issues:
    name: Known Issues (Report Only)
    runs-on: ubuntu-latest
    needs: critical
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build -w scripture-guide

      - name: Run Known Issue Tests
        run: npm run test:known-issues -w scripture-guide -- --ci
