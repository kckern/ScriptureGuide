name: dependabot
# Merges Dependabot's patch and minor updates once the full test suite passes, then starts a
# release (a merge made with GITHUB_TOKEN does not trigger release.yml by itself).
# Only npm patch and minor updates merge themselves. Majors, unparsed versions and GitHub Actions
# updates (GITHUB_TOKEN may not merge changes to .github/workflows) stay open for a person.
on: pull_request
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  meta:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.m.outputs.update-type }}
      ecosystem: ${{ steps.m.outputs.package-ecosystem }}
    steps:
      - id: m
        uses: dependabot/fetch-metadata@v2
  test:
    needs: meta
    if: needs.meta.outputs.ecosystem == 'npm_and_yarn' && contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), needs.meta.outputs.type)
    uses: ./.github/workflows/test.yml
  merge:
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.html_url }}
    steps:
      - run: gh pr merge --squash "$PR"
      - run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master
