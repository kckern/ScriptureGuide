language: en

delimiters:
  chapter_verse: [":", "."]
  range: ["-", "–", "—", "through", "to"]
  list: [",", ";", "and"]

numerals:
  roman: { I: 1, II: 2, III: 3, IV: 4 }
  spelled: { first: 1, second: 2, third: 3, fourth: 4 }

labels:
  chapter: ["chapter", "ch", "chap"]
  verse: ["verse", "v", "vv", "vs"]
  section: ["section", "sec"]

joiners: ["and", ";", ",", "&", "compare", "see also", "see", "cf", "c.f.", "cited at", "also"]

# Abbreviations that are also ordinary English words. Matched case-insensitively
# they turn prose into citations ("the aspect ratio is 16:9" -> Isaiah 16:9), so
# they only count as book names when capitalized: "Is 16:9" resolves, "is 16:9"
# does not. Full book names are unaffected -- lowercase "leviticus 19" still
# matches. "acts" is deliberately absent: it is a real book name people type
# lowercase, and the theater sense ("Acts 2 of the play") is capitalized anyway,
# so a case rule would not catch it.
capitalized_only: ["is", "am", "he", "re", "la", "co", "col", "act"]

pre_rules:
  # Strip Gospel/Epistle prefixes
  - ["\\bgospel\\s+(?:of|according\\s+to)\\s+", ""]
  - ["\\bepistle\\s+(?:of|to(?:\\s+the)?)\\s+(?!jeremiah)", ""]
  - ["\\bletter\\s+(?:of|to(?:\\s+the)?)\\s+(?!jeremiah)", ""]
  # Alternate book names
  - ["\\bsong of songs\\b", "Solomon's Song"]
  - ["\\bcanticle of canticles\\b", "Solomon's Song"]
  # Hyphenated Joseph Smith abbreviations (JS-H, JS—H, JS-Hist, JS-M, JS-Matt)
  # to the jsh/jsm alts — before the book-range dash rule would split them
  # ("js-h" -> "js - h").
  - ["\\bjs[\\s–—-]+h(?:ist(?:ory)?)?\\b", "jsh"]
  - ["\\bjs[\\s–—-]+m(?:att(?:hew)?)?\\b", "jsm"]
  # Roman numerals to Arabic
  - ["\\bIV\\s+(?=[A-Za-z])", "4 "]
  - ["\\bIII\\s+(?=[A-Za-z])", "3 "]
  - ["\\bII\\s+(?=[A-Za-z])", "2 "]
  - ["\\bI\\s+(?=[A-Za-z])", "1 "]
  # Spelled ordinals
  - ["\\bfirst\\s+(?=[A-Za-z])", "1 "]
  - ["\\bsecond\\s+(?=[A-Za-z])", "2 "]
  - ["\\bthird\\s+(?=[A-Za-z])", "3 "]
  - ["\\bfourth\\s+(?=[A-Za-z])", "4 "]
  # Punctuation normalization
  # "&" is a joiner for detection, so a detected span can read
  # "2 Ne. 21:10-12 & 2 Ne. 27:26" -- but lookup could not parse it, leaving a
  # rendered citation that does not resolve. Only an "&" that FOLLOWS A DIGIT
  # joins two references; the book names "D & C" and "Doctrine & Covenants" have
  # a letter there, and "D&C" has no surrounding space at all.
  - ["(\\d)\\s+&\\s+", "$1; "]
  - ["[.]{2,}", ";"]
  - ["(\\d+) (\\d+)", "$1.$2"]
  - ["([0-9])[.]\\s*([0-9])", "$1:$2"]
  - ["([a-z])[ .-]*0+", "$1"]
  - ["^(\\d+)-", "$1"]
  - [" ", " "]
  # Ordinal suffixes
  - ["([0-9])th\\b", "$1"]
  - ["([1-4])(st|nd|d|rd|th)\\b", "$1"]
  # Spelled delimiters
  - ["\\bchapter\\s+(\\d+),?\\s*verses?\\s+(\\d+)\\s*(?:through|to|-)\\s*(\\d+)", "$1:$2-$3"]
  - ["\\bchapter\\s+(\\d+),?\\s*verse\\s+(\\d+)", "$1:$2"]
  - ["\\bch\\.?\\s+(\\d+),?\\s*v(?:v|s)?\\.?\\s+(\\d+)", "$1:$2"]
  - ["\\bverses?\\s+(\\d+)\\s+(?:through|to)\\s+(\\d+)", ":$1-$2"]
  - ["\\bverses?\\s+(\\d+)\\s*,\\s*(\\d+)", ":$1,$2"]
  # Chapter/section stripping
  - [",*\\s*\\b(?:ch\\b|chap(?:t*er)*s*)\\.\\,*\\s*(\\d+)", "$1"]
  - [",*\\s*\\b(?:sec\\b|section)\\.\\s*(\\d+)", "$1"]
  - ["([0-9]),*\\s*\\b(?:chapt*ers*|ch|chptrs*)\\.?,*\\s*([0-9])", "$1:$2"]
  - ["([a-z]),*\\s*\\b(?:chapt*ers*|ch|chptrs*)\\s*([0-9])", "$1 $2"]
  # Entity/punctuation cleanup
  - ["[()]+", " "]
  - ["(?:&(?:ndash|mdash|minus)|&#(?:8211|8212|8722))", "-"]
  - ["[\\s.]*[–—−\\-]+[\\s.]*", "-"]
  - ["([;,])\\s*and\\s*", "$1"]
  - ["([0-9])[ .]*and[ .]*", "$1,"]
  - ["(\\d)(\\.|: )(\\d)", "$1:$3"]
  - ["\\s+(\\d+)[-–—](\\d+:\\d+)", " $1:1-$2"]
  - ["(\\d)([A-Z])", "$1 $2"]
  - ["(\\d) ([A-Z])$", "$1$2"]
  - ["([0-9]),\\s*([1-4]*\\s*[a-z])", "$1; $2"]
  - ["([a-z]), ([0-9])", "$1 $2"]
  - ["\\.", " "]
  - [" - ", " "]
  - ["; ", ";"]
  - [": ", ":"]
  - ["(\\D)-(\\d)", "$1 $2"]
  - ["([a-z]),", "$1"]
  - [",\\s*((?:\\d+\\s)*[a-z])", "; $1"]
  - ["\\bv*ve*r*s*e*s*\\s*([0-9])", ":$1"]
  - ["(, *)*\\bverses*\\s*([0-9])", ":$1"]
  - ["\\s*:", ":"]
  - [";\\s*:", ":"]
  - ["(\\d+) *to *(\\d+)", "$1-$2"]
  - ["([A-za-z])(\\d)", "$1 $2"]
  - ["([0-9]),\\s*([1-4]*\\s*[a-z])", "$1; $2"]
  - ["o([nf])", "o$1"]
  - ["([;,])", "$1 "]
  - ["(the )*book of", ""]
  - [",\\s*([0-9]+)\\s*:", "; $1:"]
  - ["\\b\\s*cf[:.]*\\s*\\b", " "]

post_rules:
  - ["(Words of Mormon|Articles of Faith|4 Nephi|Jarom|Enos|Omni|Obadiah|2 John|3 John|Philemon|Jude|First Vision|Joseph Smith—.+)\\s+([2-9]|(\\d\\d+))", "$1 1:$2"]
  - ["(^|;\\s*)(Nephi|cor|kings|chron|thes|pet|tim)", "$1 1 $2"]
  - ["\\s+", " "]
  - ["([a-z]\\s*\\d+)(-\\d+:\\d+)", "$1:1$2"]
  - ["--", "—"]
