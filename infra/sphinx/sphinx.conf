#!/bin/sh
# Sphinx runs this file through sh, so credentials come from the environment at
# start-up and are never baked into an image. Index settings mirror production.
cat <<CONF
source sg
{
    type        = mysql
    sql_host    = ${MYSQL_HOST}
    sql_user    = ${MYSQL_USER}
    sql_pass    = ${MYSQL_PASSWORD}
    sql_db      = ${MYSQL_DATABASE}
    sql_port    = ${MYSQL_PORT:-3306}
    sql_query   = SELECT id, verse_id, version, book_id, text FROM scripture_verses
}

index sgindex
{
    source              = sg
    path                = /opt/sphinx/index/sgindex
    mlock               = 0
    morphology          = stem_en
    min_stemming_len    = 3
    min_word_len        = 1
    min_infix_len       = 1
    charset_table       = 0..9, A..Z->a..z, _, a..z, U+AC00..U+D7A3, U+1100..U+1159, U+1161..U+11A2, U+11A8..U+11F9
    ngram_len           = 1
    field_string        = text
    attr_uint           = book_id
    attr_uint           = verse_id
    attr_string         = version
}

indexer
{
    mem_limit = 512M
}

searchd
{
    listen          = 9312
    listen          = 9306:mysql41
    log             = /opt/sphinx/log/searchd.log
    query_log       = /opt/sphinx/log/query.log
    read_timeout    = 5
    pid_file        = /opt/sphinx/searchd.pid
    seamless_rotate = 1
    preopen_indexes = 1
    unlink_old      = 1
    binlog_path     = /opt/sphinx/index/
}
CONF
